[package]
name = "dev-assistant"
version = "1.0.13"
description = "DevAssistant - 个人开发效率工具"
authors = ["DevAssistant Team"]
edition = "2021"

[package.metadata.winres]
OriginalFilename = "dev-assistant.exe"
LegalCopyright = "DevAssistant Team"
FileDescription = "DevAssistant"

[lib]
name = "dev_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
regex = "1.10"
clipboard = "0.5"
arboard = "3.4"
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
rayon = "1.10"  # 并行处理库，用于加速文件扫描
xcap = "0.0.14"
img_hash = "3.2"
base64 = "0.22"
image = "0.25"
serde_yaml = "0.9"
once_cell = "1.19"
sha2 = "0.10"

# Windows-specific dependencies for AppLauncher
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
clipboard-win = "5.4"
mslnk = "0.1"
winapi = { version = "0.3", features = ["shellapi", "winuser", "windef", "wingdi", "handleapi", "errhandlingapi", "sysinfoapi"] }
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_SystemServices"] }
encoding_rs = "0.8"  # 用于处理 Windows PowerShell 输出的 GBK 编码

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

[profile.release]
panic = "abort"
codegen-units = 4      # 4线程编译，比1快3-4倍
lto = "thin"           # thin LTO，比 true 快5倍，体积只大5%左右
opt-level = "s"
strip = true

# 正式发布用：体积最小但编译慢
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
