[package]
name = "dev-assistant"
version = "0.1.0"
description = "DevAssistant - 个人开发效率工具"
authors = ["DevAssistant Team"]
edition = "2021"

[package.metadata.winres]
OriginalFilename = "dev-assistant.exe"
LegalCopyright = "DevAssistant Team"
FileDescription = "DevAssistant"

[lib]
name = "dev_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
regex = "1.10"
clipboard = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
