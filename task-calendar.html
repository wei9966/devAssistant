<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Calendar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: transparent;
      }
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 8px;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #task-calendar {
        width: 100%;
        height: 100%;
      }
      /* 确保 Vue 组件根元素和 n-config-provider 填满高度 */
      #task-calendar > div,
      #task-calendar > div > div {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="task-calendar"></div>
    <script type="module" src="/src/task-calendar/main.ts"></script>
  </body>
</html>
